<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAMEO</title>
<meta name="description" content="CAMEO is an open catalog of machine-learning experiments: model architectures, training recipes and results, comparable across studies.">
<meta name="theme-color" content="#0B6B75">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B6B75'/%3E%3Cpath d='M21.5 11.5a7 7 0 1 0 0 9' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: benchmark header, then a two-column workbench. Left: linked chart and leaderboard. Right: sticky run inspector. */
  --paper:#F5F6F8; --surface:#FFFFFF; --ink:#141A24; --ink-2:#465063; --muted:#5E6A7C; --line:#DEE2E9; --line-2:#EEF0F4;
  --accent:#0B6B75; --accent-wash:#E3F1F2;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --other:#A3AAB6;
  --w-fill:#E4F2EE; --w-line:#2F8672; --n-fill:#ECE9F8; --n-line:#6E60C0; --c-fill:#FBEFE3; --c-line:#C27A2C;
  --warn:#7A4F00; --warn-fill:#FBF1DA; --band:#0B6B7514; --gold:#A67C00; --silver:#6B7686; --bronze:#9C5A28;
  --q1:#cde2fb; --q2:#9ec5f4; --q3:#5598e7; --q4:#1c5cab; --q5:#0d366b; --qline:#5598e7;
  --font-display:"IBM Plex Serif",Georgia,serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1116; --surface:#161A21; --ink:#E7EAF0; --ink-2:#B3BAC6; --muted:#98A2B1; --line:#2A303B; --line-2:#1F242D;
    --accent:#62C6D2; --accent-wash:#14343A;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --other:#5E6675;
    --w-fill:#13332D; --w-line:#4FBFA4; --n-fill:#272250; --n-line:#9C8FF0; --c-fill:#3A2A14; --c-line:#D99A4E;
    --warn:#F0C674; --warn-fill:#3A2E12; --band:#62C6D21F; --gold:#E0B84A; --silver:#AEB7C4; --bronze:#D08A54;
    --q1:#173a66; --q2:#1c5cab; --q3:#3987e5; --q4:#86b6ef; --q5:#cde2fb; --qline:#256abf;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1116; --surface:#161A21; --ink:#E7EAF0; --ink-2:#B3BAC6; --muted:#98A2B1; --line:#2A303B; --line-2:#1F242D;
  --accent:#62C6D2; --accent-wash:#14343A;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --other:#5E6675;
  --w-fill:#13332D; --w-line:#4FBFA4; --n-fill:#272250; --n-line:#9C8FF0; --c-fill:#3A2A14; --c-line:#D99A4E;
  --warn:#F0C674; --warn-fill:#3A2E12; --band:#62C6D21F; --gold:#E0B84A; --silver:#AEB7C4; --bronze:#D08A54;
    --q1:#173a66; --q2:#1c5cab; --q3:#3987e5; --q4:#86b6ef; --q5:#cde2fb; --qline:#256abf;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14.5px/1.5 var(--font-body)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--font-mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1480px;margin:0 auto;padding:0 24px}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:52px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{font-family:var(--font-display);font-size:19px;letter-spacing:.02em}
.crumbs{color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.crumbs b{color:var(--ink);font-weight:500}
.proto{margin-left:auto;font-size:12.5px;color:var(--warn);background:var(--warn-fill);padding:3px 10px;border-radius:999px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;padding:26px 0 18px;align-items:start}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--font-display);font-weight:500;font-size:30px;line-height:1.2;margin:4px 0 8px;text-wrap:balance}
.lede{color:var(--ink-2);max-width:68ch;margin:0 0 14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 22px;margin:0}
.facts div{border-top:1px solid var(--line);padding-top:7px}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-weight:500}
.credit{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.credit h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.who{display:flex;gap:12px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-wash);color:var(--accent);display:grid;place-items:center;font-weight:600;flex:none}
.who b{display:block;font-weight:600}
.who span{color:var(--ink-2);font-size:13.5px}
.credit p{margin:10px 0 0;color:var(--ink-2);font-size:13.5px}
.gaps{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.gap{border:1px dashed var(--line);border-radius:999px;padding:1px 8px;color:var(--ink-2)}
.finding{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 14px;margin:0 0 18px;color:var(--ink-2)}
.finding b{color:var(--ink);font-weight:600}

/* workbench */
.work{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:20px;align-items:start;padding-bottom:48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.card + .card{margin-top:20px}
.card-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.card-h h2{font-size:15px;font-weight:600;margin:0}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{border:0;background:none;padding:7px 12px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-weight:500}
.tab:hover{background:var(--line-2)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:end;padding:10px 16px 0}
.ctl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.ctl select,.ctl input{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:5px 8px;font-size:13.5px;color:var(--ink);min-height:32px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;cursor:pointer;font-size:13.5px;color:var(--ink-2);min-height:30px}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-wash);color:var(--accent);font-weight:600}
.legend{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 2px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 8px;cursor:pointer;font-size:13px;color:var(--ink)}
.chip[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums}
.chip svg{flex:none}
.plot{position:relative;padding:4px 8px 0;overflow-x:auto}
.plot svg{display:block;user-select:none;-webkit-user-select:none}
.plot text{font-family:var(--font-body);fill:var(--ink-2);font-size:12px}
.plot .axis-t{fill:var(--ink);font-size:12.5px;font-weight:500}
.plot .dl{fill:var(--ink);font-size:12.5px;font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.plot .dl2{fill:var(--ink-2);font-size:12px;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.4;max-width:300px;z-index:5;box-shadow:0 6px 20px #0003;display:none}
.tip b{display:block;font-family:var(--font-mono);font-weight:500;font-size:12px;word-break:break-all}
.tip .row{display:flex;justify-content:space-between;gap:16px}
.tip .row span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.cap{padding:6px 16px 14px;color:var(--ink-2);font-size:13px;max-width:92ch}
.cap button,.linkish{border:0;background:none;color:var(--accent);padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* leaderboard */
.tablewrap{overflow:auto;max-height:560px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 9px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line-2)}
th{position:sticky;top:0;background:var(--surface);z-index:2;font-weight:600;font-size:12.5px;color:var(--ink-2);border-bottom:1px solid var(--line)}
th button{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--line-2)}
tbody tr[aria-selected="true"]{background:var(--accent-wash)}
td.name{font-family:var(--font-mono);font-size:12.5px;max-width:215px;overflow:hidden;text-overflow:ellipsis}
td.fam{max-width:215px;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:baseline}
.pill{display:inline-block;border-radius:999px;padding:0 8px;font-size:12px;line-height:20px;white-space:nowrap}
.pill.tie{background:var(--accent-wash);color:var(--accent);font-weight:600}
.pill.bad{background:var(--warn-fill);color:var(--warn)}
.pill.plain{background:var(--line-2);color:var(--ink-2)}
.tnote{padding:10px 16px;color:var(--ink-2);font-size:13px;border-bottom:1px solid var(--line-2)}

/* inspector */
.insp{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.insp-h{padding:14px 16px 10px;border-bottom:1px solid var(--line-2)}
.insp-h .k{font-size:12px;color:var(--muted)}
.insp-h h2{font-family:var(--font-mono);font-weight:500;font-size:15px;margin:2px 0 8px;word-break:break-word;line-height:1.35}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.itabs{padding:8px 12px;border-bottom:1px solid var(--line-2)}
.sec{padding:12px 16px;border-bottom:1px solid var(--line-2)}
.sec:last-child{border-bottom:0}
.sec h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.sec h3 .sp{margin-left:auto;display:flex;gap:6px;text-transform:none;letter-spacing:0}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{border:1px solid var(--line-2);border-radius:8px;padding:6px 9px}
.metric span{display:block;font-size:11.5px;color:var(--muted)}
.metric b{font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.metric.obj{border-color:var(--accent);background:var(--accent-wash)}
.q{margin:0 0 8px;color:var(--ink-2);font-size:13.5px}
.q b{color:var(--ink);font-weight:600}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.sm{padding:2px 8px;font-size:12px}
.btn{white-space:nowrap}
.set{width:100%;font-size:13px}
.set td{padding:3px 0;border:0;white-space:normal}
.set td:nth-child(2){text-align:right;font-family:var(--font-mono);font-size:12.5px}
.set td:nth-child(3){text-align:right;color:var(--muted);font-size:12px;width:92px}
.set tr.own td:first-child{font-weight:600}
.set tr.own td:nth-child(3){color:var(--accent)}
.set .sgrp td{padding-top:8px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.warnline{background:var(--warn-fill);color:var(--warn);border-radius:7px;padding:6px 9px;font-size:12.5px;margin-top:8px}

/* model workflow */
.flow{font-size:12.5px}
.io{display:flex;justify-content:space-between;gap:10px;border:1.5px solid var(--ink);border-radius:8px;padding:5px 10px;font-weight:600}
.io span:last-child{font-family:var(--font-mono);font-weight:500}
.arrow{height:14px;margin-left:18px;border-left:1.5px solid var(--muted);position:relative}
.arrow::after{content:"";position:absolute;left:-4.5px;bottom:-1px;border:4px solid transparent;border-top:6px solid var(--muted);border-bottom:0}
.op{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:baseline;border:1px solid var(--line);border-left-width:3px;border-radius:6px;padding:4px 8px;background:var(--surface)}
.op + .op,.op + details,details + .op,details + details{margin-top:4px}
.op .what{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op .what b{font-weight:600}
.op .what i{font-style:normal;color:var(--muted)}
.op .shape,.grp > summary .shape{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.op .par,.grp > summary .par{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--muted);min-width:58px;text-align:right;white-space:nowrap}
.op.k-weights{border-left-color:var(--w-line);background:var(--w-fill)}
.op.k-norm{border-left-color:var(--n-line);background:var(--n-fill)}
.op.k-custom{border-left-color:var(--c-line);background:var(--c-fill)}
.op.k-shape{border-left-color:var(--ink-2)}
.op.k-light{border-left-color:var(--line);color:var(--ink-2)}
.op.unused,.grp.unused{opacity:.55;border-style:dashed}
.grp{border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.grp > summary{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:baseline;cursor:pointer;padding:5px 8px;list-style:none}
.grp > summary::-webkit-details-marker{display:none}
.grp > summary .what::before{content:"▸";display:inline-block;width:14px;color:var(--muted)}
.grp[open] > summary .what::before{content:"▾"}
.grp > summary .what{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp > summary .what b{font-weight:600}
.grp > summary .gsum{grid-column:1/-1;color:var(--muted);font-size:11.5px;padding-left:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp[open] > summary .gsum{display:none}
.grp > summary .what i{font-style:normal;color:var(--muted)}
.times{display:inline-block;background:var(--ink);color:var(--surface);border-radius:5px;padding:0 6px;font-size:11.5px;font-weight:600;margin-left:6px}
.grp > .body{padding:2px 8px 8px 14px}
.key{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 0;font-size:11.5px;color:var(--muted)}
.key span[class]::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.key .kw::before{background:var(--w-fill);border-color:var(--w-line)}
.key .kn::before{background:var(--n-fill);border-color:var(--n-line)}
.key .kc::before{background:var(--c-fill);border-color:var(--c-line)}
.fine{color:var(--muted);font-size:12px;margin:8px 0 0}
pre.src{margin:0;max-height:420px;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.5 var(--font-mono);white-space:pre;tab-size:4}
.ok{color:var(--accent);font-weight:600}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}
.err{margin:24px 0;padding:14px 16px;border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;background:var(--surface)}
@media (max-width:1100px){
  .hero,.work{grid-template-columns:minmax(0,1fr)}
  .insp{position:static;max-height:none}
}
@media (max-width:520px){
  .wrap{padding:0 16px}
  h1{font-size:25px}
  .metrics{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:no-preference){ .tab,.btn,.chip{transition:background-color .12s,color .12s,border-color .12s,opacity .12s} }

/* axis pickers, axis editing, lineage */
.quick{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;padding:10px 16px 0;font-size:13px;color:var(--muted)}
.pick{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pick select{max-width:250px}
.btn.swap{align-self:end;min-height:32px;padding:4px 9px}
.axedit{display:flex;flex-direction:column;gap:7px;margin:10px 16px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);align-items:flex-start}
.axed{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);width:100%}
.axed b{color:var(--ink);font-weight:600;width:74px}
.axed label{display:flex;gap:5px;align-items:center}
.axed label.grow{flex:1;min-width:190px}
.axed input,.axed select{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:3px 7px;font-size:13px;color:var(--ink);min-height:28px}
.axed input.n{width:96px;font-family:var(--font-mono);font-size:12.5px}
.axed label.grow input{flex:1;min-width:0}
.hint{color:var(--muted)}
.linkey{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;padding:10px 16px 0;font-size:12.5px;color:var(--ink-2)}
.qk{display:inline-flex;gap:5px;align-items:center}
.qk i{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid var(--qline);font-style:normal}
.qk i.x{border:0;color:var(--muted);font-weight:700;width:auto;height:auto;line-height:1}
.qk i.ln{border:0;border-top:1.5px solid var(--ink-2);border-radius:0;width:22px;height:0}
.qk i.ln.dash{border-top:2px dashed var(--accent)}
.qk i.dia{border:1.6px solid var(--accent);border-radius:0;width:9px;height:9px;transform:rotate(45deg);margin:0 3px}
.plot .lin-lab{font-family:var(--font-mono);font-size:11.5px;fill:var(--ink)}
.plot .lin-num{font-size:11.5px;fill:var(--ink-2);font-variant-numeric:tabular-nums}

/* declutter: summary header, options panel, status line, slimmer inspector */
.hero2{padding:22px 0 4px}
.hrow{display:flex;gap:16px 24px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.sub{color:var(--ink-2);margin:0}
.hero2 .who span{display:block}
.hero2 .who .dep{color:var(--muted);font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0 12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat .k{display:block;font-size:12px;color:var(--muted)}
.stat b{display:block;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.stat .s{display:block;font-size:12.5px;color:var(--ink-2)}
.brief{display:flex;gap:10px;align-items:baseline;margin:0 0 4px;color:var(--ink-2)}
.brief p{margin:0;flex:1;min-width:0}
.brief p b{color:var(--ink);font-weight:600}
.clamp1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.about{margin:0 0 18px}

function copyText(text, btn){

/* ----- step 1: submit a file; it is read here, never uploaded ----- */
function openDeposit(){
  openDialog(dlg => {
    const out = h("div",{id:"depout"});
    const input = h("input",{type:"file",id:"depfile",accept:".json,application/json",style:"position:absolute;left:-9999px","aria-label":"Study JSON file"});
    input.addEventListener("change", e => { const f = e.target.files[0]; if (f) readFile(f, out); });
    const drop = h("div",{class:"drop"}, h("p",{style:"margin:0 0 8px",text:"Drop a study JSON here"}), h("button",{class:"btn",text:"Choose a file",onclick:()=>input.click()}), input);
    drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));

    put(dlg, h("h2",{text:"Deposit a study"}), h("p",{class:"steps",text:"1 Check the file  ·  2 Preview and edit, staged  ·  3 Publish"}), drop,
      h("p",{class:"fine",text:"The file is read in this browser only. Nothing is sent anywhere until you publish."}), out,

function readFile(file, out){
  out.replaceChildren(h("p",{class:"q",text:"Reading " + file.name + "…"}));
  const fr = new FileReader();
  fr.onload = () => checkFile(String(fr.result), file, out, false);
  fr.onerror = () => out.replaceChildren(h("div",{class:"warnline",text:"The file could not be read. Try choosing it again."}));
  fr.readAsText(file);
}
/* JSON has no Infinity or NaN. Find bare ones outside strings so they can be recorded as diverged. */
function scanNonFinite(text){
  const parts = []; let i = 0, last = 0, inStr = false, count = 0, firstLine = null, line = 1; const n = text.length;
  while (i < n){ const c = text.charCodeAt(i);
    if (inStr){ if (c === 92){ i += 2; continue; } if (c === 34) inStr = false; else if (c === 10) line++; i++; continue; }
    if (c === 34){ inStr = true; i++; continue; }
    if (c === 10){ line++; i++; continue; }
    if (c === 73 || c === 78 || c === 45){ const m = /^(-?Infinity|NaN)/.exec(text.substr(i, 9));
      if (m){ parts.push(text.slice(last, i), "null"); i += m[1].length; last = i; count++; if (firstLine == null) firstLine = line; continue; } }
    i++; }
  parts.push(text.slice(last)); return {text:parts.join(""), count, firstLine};
}
function checkFile(text, file, out, fix){
  const li = (cls, ic, ...kids_) => h("li",{class:cls}, h("span",{class:"ic",text:ic}), h("span",null, ...kids_));
  const items = [li("fine-ok","✓",`Read ${file.name} (${(file.size/1e6).toFixed(1)} MB)`)], show = extra => out.replaceChildren(h("ul",{class:"todo",style:"margin-top:12px"}, items), ...(extra ? [extra] : []));
  let S = null, scan = null;
  try{ S = JSON.parse(text); }
  catch(e){
    scan = scanNonFinite(text);
    if (scan.count && !fix){ items.push(li("blk","!", `${scan.count} number${scan.count>1?"s are":" is"} Infinity or NaN, which JSON does not allow. The first is on line ${fmtInt(scan.firstLine)}. `,
      h("button",{class:"btn sm",text:"Record as diverged and continue",onclick:()=>checkFile(text, file, out, true)}))); show(); return; }
    if (!scan.count){ items.push(li("blk","!","This is not valid JSON: " + e.message)); show(); return; }
    try{ S = JSON.parse(scan.text); items.push(li("fine-ok","✓",`${scan.count} non-finite number${scan.count>1?"s":""} recorded as diverged`)); }
    catch(e2){ items.push(li("blk","!","Still not valid JSON after that fix: " + e2.message)); show(); return; }
  }
  S = toInternal(S);
  if (!S || !Array.isArray(S.trials) || !Array.isArray(S.models) || !S.study){
    items.push(li("blk","!",RULES.checks.shape.message + " " + RULES.checks.shape.fix)); show(); return; }
  let conv; try{ conv = fromStudy(S); }catch(e){ items.push(li("blk","!","The file could not be read as a study: " + e.message)); show(); return; }
  if (!conv.runs.some(r => r.score != null) && !S.trials.some(t => kindOf(t) === "reported" && hasMetric(t))){ items.push(li("blk","!","No run in this file has a score, so there is nothing to show.")); show(); return; }
  if (!known(S.study.license)){ S.study.license = RULES.license_default; items.push(li("fine-ok","✓",`License set to the default, ${RULES.license_default}. You can change it.`)); }
  const rep0 = checkStudy(S);
  items.push(li(rep0.blocking.length ? "sug" : "fine-ok", rep0.blocking.length ? "+" : "✓", `${rep0.blocking.length} needed before publishing, ${rep0.suggested.length} suggested`));
  items.push(li("fine-ok","✓",`Study format ${S.format_version || "not stated"}: ${conv.runs.length} runs, ${conv.models.length} architectures, ${conv.runs.filter(r => r.score != null || r.kind === "reported").length} with a result`));
  show(h("div",{class:"foot",style:"justify-content:flex-start"}, h("button",{class:"btn pri",id:"openstaged",text:"Open the staged view",onclick:()=>{
    closeDialog(); stageStudy(S, {fileName:file.name}); window.scrollTo(0,0); }})));
}
async function stageExample(){
  const id = INDEX.studies.find(x => !x.made_up).id;
  if (!STUDIES[id]){ try{ STUDIES[id] = toInternal(await getJSON("studies/" + id + ".json")); }catch(e){ return; } }
  BUNDLED = STUDIES[id]; closeDialog();
  const S = clone(BUNDLED); S.study.title = "not_reported";   /* so the staged view has something to fill in */
  stageStudy(S, {bundled:true, fileName:"study.json"}); window.scrollTo(0,0);
}
/* a study file (format 0.2, or 0.1 as the search tool writes it) -> what this page draws */
function fromStudy(S){
  for (const k of ["study","contributor","dataset","objective","evaluation"]) if (!isObj(S[k])) S[k] = {};
  const fin = v => (typeof v === "number" && isFinite(v)) ? v : null, mp = o => { const out = {}; for (const k in (isObj(o) ? o : {})) out[k] = fin(o[k]); return out; };
  const {recipes, implied} = recipesOf(S), M = {}; for (const m of S.models) M[m.id] = m;
  const recBy = {};
  const runs = S.trials.map((t, i) => { const r = isObj(t.result) ? t.result : {}, m = M[t.model] || {}, note = (t.notes||[]).map(x => x.text).join(" "), mm = /candidate (C\d+) \(lineage [^,]+, ([a-z_]+)\)/.exec(note), test = mp(r.test), valid = mp(r.valid);
    const evals = (Array.isArray(r.evaluations) ? r.evaluations : []).filter(isObj).map(e => ({dataset:known(e.dataset) ? e.dataset : "main", split:known(e.split) ? String(e.split) : "test", metrics:mp(e.metrics)}));
    for (const e of evals){ const tgt = /^val/.test(e.split) ? valid : test; for (const k in e.metrics){ const key = e.dataset === "main" ? k : e.dataset + ":" + k; if (!(key in tgt)) tgt[key] = e.metrics[k]; } }   /* so every evaluation can go on a chart axis */
    const div = new Set((Array.isArray(r.diverged) ? r.diverged : []).map(String).filter(d => !/^valid\./.test(d)).map(d => d.replace(/^test\./, "")));
    if (r.status === "done") for (const k in test) if (test[k] == null) div.add(k);
    const p = fin(r.parameters); if (p != null) (recBy[t.model] = recBy[t.model] || new Set()).add(p);
    return {id:t.id, n:i+1, model:t.model, name:known(m.name) ? m.name : t.model, fam:known(m.family) ? m.family : "unknown", lin:known(t.lineage) ? t.lineage : "none", parent:known(t.parent_trial) ? t.parent_trial : null,
      move:known(t.move) ? t.move : null, purpose:t.purpose, status:r.status, cls:known(r.classification) ? r.classification : null, seed:t.seed, score:fin(r.score), v:valid, t:test, diverged:[...div],
      bestEp:fin(r.best_epoch), ep:fin(r.epochs_run), params:p != null ? p : fin(m.parameters), mins:fin(r.runtime_minutes),
      recipe:recipeId(t, recipes), sp:isObj(t.second_parent) ? t.second_parent : null,
      hp:isObj(t.training) ? t.training : {}, hyp:known(t.hypothesis) ? t.hypothesis : null, pred:t.predicted_effect, note,
      weights:weightLink(t.weights), kind:kindOf(t), evals, reported:kindOf(t) === "reported" ? {citation:isObj(t.reported_in) && known(t.reported_in.citation) ? String(t.reported_in.citation) : null, where:isObj(t.reported_in) && known(t.reported_in.where) ? String(t.reported_in.where) : null, note:isObj(t.reported_in) && known(t.reported_in.note) ? String(t.reported_in.note) : null, link:weightLink(sourceLink(t))} : null, op:isCross(t) ? "crossover" : (mm ? mm[2] : null), speed:fin((m.inference_speed || {}).seq_per_s)}; });
  const models = S.models.map(m => { const tree = isObj(m.layers) ? m.layers : null, tp = fin(m.parameters) != null ? fin(m.parameters) : (tree ? fin(tree.params) : null), rec = [...(recBy[m.id] || [])], src = pathGet(m, "custom_ops.model_source.reference_implementation");
    return {id:m.id, name:m.name, fam:m.family, parent:m.parent, change:known(m.change_summary) ? m.change_summary : null, src:known(src) ? String(src) : "", tree, traced_params:tp, recorded:rec,
      match:(tree && rec.length) ? rec.includes(tp) : null, io:{inputs:m.inputs, outputs:m.outputs}, adaptation:known(m.adaptation) ? String(m.adaptation) : null,
      base:isObj(m.base_model) && (known(m.base_model.name) || known(m.base_model.link)) ? {name:known(m.base_model.name) ? String(m.base_model.name) : null, link:weightLink(m.base_model.link)} : null}; });
  const lineages = {}; for (const [k, v] of Object.entries(isObj(S.lineages) ? S.lineages : {})) if (isObj(v)) lineages[k] = {name:known(v.name) ? v.name : k, family:v.family, parents:Array.isArray(v.parents) ? v.parents.filter(known) : []};
  for (const r of runs) if (!lineages[r.lin]) lineages[r.lin] = {name:r.lin, family:r.fam, parents:[]};
  const sm = isObj(S.summary) ? S.summary : {}, se = isObj(S.search) ? S.search : {}, fails = {}; for (const f of (Array.isArray(sm.failures) ? sm.failures : [])) fails[f.trial] = f.lesson;
  const arr = v => Array.isArray(v) ? v : [], fam = new Set(models.map(m => known(m.fam) ? m.fam : "unknown"));
  const meta = {study:S.study, contributor:S.contributor, objective:S.objective, dataset:S.dataset, evaluation:S.evaluation,
    benchmark_title:known(S.dataset.name) ? String(S.dataset.name).split(/,| \(/)[0] : null,
    search:{method:se.method, budget:se.budget || {}, defaults:(Object.values(recipes)[0] || {}).settings || {}, space:se.training_space},
    recipes, recipesImplied:implied, datasets:datasetsOf(S), summary:{best_trial:sm.best_trial, findings:arr(sm.findings), open_questions:arr(sm.open_questions)}, failures:fails, lineages,
    speed:isObj(S.evaluation.speed_context) ? S.evaluation.speed_context : null,
    counts:{runs:runs.length, models:models.length, families:fam.size, done:runs.filter(r => r.status === "done").length, invalid:runs.filter(r => r.status !== "done").length, traced:models.filter(m => m.tree).length}};
  return {meta, runs, models};
}

/* ----- step 3: review what changed, then publish ----- */
function exportText(reason){
  const ch = changes(), fv = id => fval(FIELDS.find(f => f.id === id));
  if (ENTRY.raw && (ENTRY.status === "staged-new" || INDEX.site.live)){
    const S = clone(ENTRY.raw); S.study = S.study || {}; S.contributor = S.contributor || {}; S.dataset = S.dataset || {};
    for (const [o, k, id] of [[S.study,"title","title"],[S.study,"question","question"],[S.study,"license","license"],[S.study,"code_url","code_url"],[S.study,"publication","publication"],
      [S.contributor,"orcid","orcid"],[S.contributor,"lab","lab"],[S.contributor,"institution","institution"],[S.dataset,"accession","accession"]]){ if (fv(id)) o[k] = fv(id); }
    for (const c of ch.result){ const t = S.trials.find(x => x.id === c.run.id); if (t && t.result){ t.result.score = c.after; if (isObj(t.result[OBJ.split]) && OBJ.metric in t.result[OBJ.split]) t.result[OBJ.split][OBJ.metric] = c.after; } }
    return JSON.stringify(toExternal(S), null, 1);
  }
  return JSON.stringify({study:META.study.id, base_version:ENTRY.version, reason:reason || null,
    details:ch.detail.map(c => ({field:c.label, from:c.before || null, to:c.after || null})),
    corrections:ch.result.map(c => ({run:c.run.id, metric:OBJ.split + "." + OBJ.metric, from:c.before, to:c.after}))}, null, 2);
}
function openReview(){
  openDialog(dlg => {
    const cl = checklist(), ch = changes(), isNew = ENTRY.status === "staged-new", n = ch.detail.length + ch.result.length;
    const reason = h("input",{type:"text",id:"reason",placeholder:ch.result.length ? "Why did these results change?" : "Optional"});
    const msg = h("p",{class:"fine",style:"color:var(--warn);min-height:1.2em"}), pub = h("button",{class:"btn pri",id:"pubbtn",text:INDEX.site.live ? "Download the file" : isNew ? "Publish" : "Publish changes"});
    pub.disabled = cl.block.length > 0 || (!isNew && n === 0);
    pub.addEventListener("click", () => { const r = reason.value.trim(); if (ch.result.length && !r){ msg.textContent = "Add a reason. Readers see it next to the revised result."; reason.focus(); return; }
      if (!INDEX.site.live){ publish(r); return; }
      const name = downloadStudy(r);   /* the live site has no server: publishing is a pull request */
      put(dlg, h("h2",{text:"Almost there"}), h("ol",{class:"steps2"}, h("li",null, "The file ", h("span",{class:"mono",text:name}), " is in your downloads."),
        h("li",null, "Open the ", h("a",{href:`https://github.com/${INDEX.site.repo}/upload/main/studies`,target:"_blank",rel:"noopener",text:"studies folder on GitHub"}), ", drop the file there, and choose to open a pull request."),
        h("li",null, "A check runs on it. Once a maintainer merges it, the site updates itself.")), h("div",{class:"foot"}, h("button",{class:"btn",text:"Done",onclick:closeDialog}))); });
    const was = v => h("span",{class:"was",style:v ? "" : "text-decoration:none",text:v || "empty"});
    const rows = ch.detail.map(c => h("tr",null, h("td",{text:c.label}), h("td",null, was(c.before)), h("td",{text:c.after || "empty"})))
      .concat(ch.result.map(c => h("tr",null, h("td",null, `Run ${c.run.n}, ${lowerFirst(OBJ.label)} `, h("span",{class:"pill rev",text:"will be marked revised"})), h("td",null, was(fmt(c.before,4))), h("td",{text:fmt(c.after,4)}))));
    put(dlg, h("h2",{text:isNew ? "Publish this study" : "Publish your changes"}),
      h("p",{class:"steps",text:isNew ? `${META.counts.runs} runs · ${META.counts.models} architectures` + (blank(META.study.license) ? "" : ` · license ${META.study.license}`) + (ENTRY.fileName ? ` · from ${ENTRY.fileName}` : "") : `Version ${ENTRY.version} → ${ENTRY.version + 1}`}),
      cl.block.length ? h("div",{class:"warnline"}, h("b",{text:"Needed before publishing: "}), cl.block.map(x => x.text).join("; ") + ".") : null,
      n ? h("table",{class:"diff"}, h("tbody",null, rows)) : h("p",{class:"q",text:isNew ? "No edits since the file was staged." : "No changes yet."}),
      h("label",{class:"fld",style:"margin-top:8px"}, ch.result.length ? "Reason for the change, shown to readers" : "Note for the history", reason), msg,
      INDEX.site.live ? h("p",{class:"fine",text:"Publishing is a pull request on GitHub. Download the file here, then add it to the studies folder. A check runs on it and a maintainer merges it."}) : h("details",{class:"about",style:"margin:0"}, h("summary",{text:"What publishing does"}),
        h("div",{class:"notes",style:"padding:6px 0 0"},
          h("p",{text:"On the real site, Publish creates a pull request for you and checks run on it. A first deposit from a new account waits for the maintainer's approval once. After that, your deposits and edits go live on their own."}),

        h("button",{class:"btn",text:"Cancel",onclick:closeDialog}), pub));
  });
}
